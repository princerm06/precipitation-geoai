name: Execute PIDF notebook test

on:
  push:
    branches:
      - mentor-mlp-optuna
    paths:
      - ".github/workflows/execute-notebook-test.yml"
      - "scripts/build_ci_notebook.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mentor-mlp-optuna

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert pandas numpy scikit-learn matplotlib tensorflow optuna geopandas shapely requests xgboost

      - name: Download NOAA source data
        run: |
          set -euo pipefail
          for rp in 2 5 10 25 50 100 200; do
            for dur in 60m 06h 12h 24h; do
              stem="se${rp}yr${dur}a"
              curl -fL "https://hdsc.nws.noaa.gov/pub/hdsc/data/se/${stem}.zip" -o "${stem}.zip"
              mkdir -p "${stem}"
              unzip -q "${stem}.zip" -d "${stem}"
              test -f "${stem}/${stem}.asc"
            done
          done
          test "$(find . -maxdepth 2 -type f -name 'se*yr*a.asc' | wc -l)" -eq 28
          echo "NOAA PIDF source ready: 28 ASC rasters"

      - name: Build dependency-safe CI notebook
        run: |
          python scripts/build_ci_notebook.py

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute UNG_PIDF_Model_ci.ipynb \
            --output executed_UNG_PIDF_Model.ipynb \
            --ExecutePreprocessor.timeout=2700 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed_UNG_PIDF_Model.ipynb
          if-no-files-found: ignore
