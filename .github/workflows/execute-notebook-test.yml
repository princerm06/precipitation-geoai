name: Execute PIDF notebook test

on:
  push:
    branches:
      - mentor-mlp-optuna
    paths:
      - ".github/workflows/execute-notebook-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mentor-mlp-optuna

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert pandas numpy scikit-learn matplotlib tensorflow optuna geopandas shapely requests xgboost

      - name: Download NOAA source data
        run: |
          curl -fL "https://hdsc.nws.noaa.gov/pub/hdsc/data/se/se200yr24ha.zip" -o se200yr24ha.zip
          ls -lh se200yr24ha.zip\n          echo "NOAA source ready"

      - name: Make CI-safe notebook copy
        run: |
          python - <<'PY'
          import json

          src = "UNG_PIDF_Model.ipynb"
          dst = "UNG_PIDF_Model_ci.ipynb"

          with open(src, "r", encoding="utf-8") as f:
              nb = json.load(f)

          skipped = []
          for i, cell in enumerate(nb.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              code = "".join(cell.get("source", []))
              if (
                  "from google.colab import files" in code
                  or "files.upload()" in code
                  or "drive.mount(" in code
              ):
                  skipped.append(i)
                  cell["source"] = [
                      "print('CI: skipped Colab-only upload/mount cell')\n"
                  ]
                  cell["execution_count"] = None
                  cell["outputs"] = []
                  continue

              if "files.download(" in code:
                  cleaned = []
                  for line in cell.get("source", []):
                      if "files.download(" not in line:
                          cleaned.append(line)
                  cleaned.append("print('CI: skipped Colab-only files.download call')\n")
                  cell["source"] = cleaned
                  cell["execution_count"] = None
                  cell["outputs"] = []

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(nb, f)

          print("Skipped Colab-only cells:", skipped)
          PY

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute UNG_PIDF_Model_ci.ipynb \
            --output executed_UNG_PIDF_Model.ipynb \
            --ExecutePreprocessor.timeout=2700 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed_UNG_PIDF_Model.ipynb
          if-no-files-found: ignore
